name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            TARGET_DIR="${{ secrets.VPS_BASE_PATH }}/staging"
            APP_NAME="masdar-staging"
            PORT=3001
          else
            TARGET_DIR="${{ secrets.VPS_BASE_PATH }}/production"
            APP_NAME="masdar-prod"
            PORT=3000
          fi

          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            cd \$TARGET_DIR || exit 1

            if [ ! -d ".git" ]; then
              git clone git@github-masdar:masdar-alhayat/masdar-web.git .
            fi

            git fetch origin
            git reset --hard origin/${{ github.event.inputs.environment }}

            npm install
            npm run build

            pm2 delete \$APP_NAME || true
            PORT=\$PORT pm2 start npm --name \$APP_NAME -- start

            pm2 save
          EOF
