name: Masdar Web Deployment - Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Setup SSH for connecting to VPS
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Deploy to VPS
      - name: Deploy
        run: |
          BASE_PATH="${{ secrets.VPS_BASE_PATH }}"

          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            APP_PATH="$BASE_PATH/staging"
            APP_NAME="masdar-staging"
            PORT=3001
            BRANCH="staging"
          else
            APP_PATH="$BASE_PATH/production"
            APP_NAME="masdar-prod"
            PORT=3000
            BRANCH="main"
          fi

          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

            set -euo pipefail

            BASE_PATH="$APP_PATH"
            APP_NAME="$APP_NAME"
            PORT="$PORT"
            BRANCH="$BRANCH"

            if [ ! -d "$BASE_PATH" ]; then
              echo "Base path does not exist: $BASE_PATH"
              exit 1
            fi

            TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
            RELEASE_DIR="$BASE_PATH/releases/$TIMESTAMP"
            LOG_DIR="$BASE_PATH/logs"
            LOG_FILE="$LOG_DIR/deploy_$TIMESTAMP.log"

            mkdir -p "$BASE_PATH/releases"
            mkdir -p "$LOG_DIR"

            {
              echo "===== DEPLOY START: $TIMESTAMP ====="

              # 🚨 FAIL FAST IF CLONE FAILS
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_masdar_actions -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
              git clone --branch "$BRANCH" git@github.com:masdar-alhayat/masdar-web.git "$RELEASE_DIR"

              cd "$RELEASE_DIR"

              # Install & build
              npm ci
              npm run build

              # Start new instance
              pm2 start npm --name "${APP_NAME}-new" -- start -- -p "$PORT"

              # Switch symlink
              ln -sfn "$RELEASE_DIR" "$BASE_PATH/current"

              # Replace old process safely
              pm2 delete "$APP_NAME" || true
              pm2 rename "${APP_NAME}-new" "$APP_NAME"

              pm2 save

              echo "===== DEPLOY SUCCESS ====="

            } >> "$LOG_FILE" 2>&1 || {

              echo "===== DEPLOY FAILED ====="
              echo "Check log: $LOG_FILE"

              # Cleanup failed process
              pm2 delete "${APP_NAME}-new" || true

              exit 1
            }

            # Cleanup old releases (keep last 3)
            cd "$BASE_PATH/releases"
            ls -dt */ | tail -n +4 | xargs rm -rf || true

          EOF