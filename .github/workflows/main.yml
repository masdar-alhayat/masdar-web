name: Masdar Web Deployment - Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # SSH Setup
      # ---------------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # ---------------------------------------------------------
      # Deployment
      # ---------------------------------------------------------
      - name: Deploy to VPS
        run: |
          BASE_PATH="${{ secrets.VPS_BASE_PATH }}"

          # Environment selection from dropdown
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            APP_PATH="$BASE_PATH/staging"
            APP_NAME="masdar-staging"
            PORT=3001
            BRANCH="staging"
          else
            APP_PATH="$BASE_PATH/production"
            APP_NAME="masdar-prod"
            PORT=3000
            BRANCH="main"
          fi

          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -euo pipefail

            BASE_PATH="$APP_PATH"
            APP_NAME="$APP_NAME"
            PORT="$PORT"
            BRANCH="$BRANCH"

            if [ ! -d "\$BASE_PATH" ]; then
              echo "Base path does not exist: \$BASE_PATH"
              exit 1
            fi

            TIMESTAMP=\$(date +"%Y-%m-%d_%H-%M-%S")
            RELEASE_DIR="\$BASE_PATH/releases/\$TIMESTAMP"
            LOG_DIR="\$BASE_PATH/logs"
            LOG_FILE="\$LOG_DIR/deploy_\$TIMESTAMP.log"

            mkdir -p "\$BASE_PATH/releases"
            mkdir -p "\$LOG_DIR"

            {
              echo "===== DEPLOY START: \$TIMESTAMP ====="

              # Correct SSH key usage
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
              git clone --branch "\$BRANCH" git@github.com:masdar-alhayat/masdar-web.git "\$RELEASE_DIR"

              cd "\$RELEASE_DIR"

              npm ci
              npm run build

              # Stop old process (if exists)
              pm2 delete "\$APP_NAME" || true

              # Correct PM2 start command
              PORT="\$PORT" NODE_ENV=production \
              pm2 start npx --name "\${APP_NAME}-new" --cwd "\$RELEASE_DIR" -- next start -p \$PORT -H 0.0.0.0

              # Zero-downtime symlink switch
              ln -sfn "\$RELEASE_DIR" "\$BASE_PATH/current"

              # Replace old process with new one
              pm2 delete "\$APP_NAME" || true
              pm2 rename "\${APP_NAME}-new" "\$APP_NAME"

              pm2 save

              echo "===== DEPLOY SUCCESS ====="

            } >> "\$LOG_FILE" 2>&1 || {

              echo "===== DEPLOY FAILED ====="
              echo "Check log: \$LOG_FILE"

              echo "===== PM2 ERROR LOG ====="
              pm2 logs "\${APP_NAME}-new" --lines 50 --err || true

              pm2 delete "\${APP_NAME}-new" || true
              exit 1
            }

            # Keep only last 3 releases
            cd "\$BASE_PATH/releases"
            ls -dt */ | tail -n +4 | xargs rm -rf || true
          EOF
