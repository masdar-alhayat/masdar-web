name: Masdar Web Deployment - Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Setup SSH for connecting to VPS
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Deploy to VPS
      - name: Deploy
        shell: bash
        run: |
          BASE_PATH="${{ secrets.VPS_BASE_PATH }}"

          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            APP_PATH="$BASE_PATH/staging"
            APP_NAME="masdar-staging"
            PORT=3001
            BRANCH="staging"
          else
            APP_PATH="$BASE_PATH/production"
            APP_NAME="masdar-prod"
            PORT=3000
            BRANCH="main"
          fi

          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            bash -s -- "$APP_PATH" "$APP_NAME" "$PORT" "$BRANCH" << 'REMOTE_SCRIPT'
          set -Eeuo pipefail

          BASE_PATH="$1"
          APP_NAME="$2"
          PORT="$3"
          BRANCH="$4"

          if [ ! -d "$BASE_PATH" ]; then
            echo "Base path does not exist: $BASE_PATH"
            exit 1
          fi

          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          RELEASE_DIR="$BASE_PATH/releases/$TIMESTAMP"
          LOG_DIR="$BASE_PATH/logs"
          LOG_FILE="$LOG_DIR/deploy_$TIMESTAMP.log"
          PREVIOUS_RELEASE=$(readlink -f "$BASE_PATH/current" || true)
          SWITCHED=0

          mkdir -p "$BASE_PATH/releases" "$LOG_DIR"
          exec > >(tee -a "$LOG_FILE") 2>&1

          rollback() {
            status=$?
            trap - ERR
            set +e
            echo "Deployment failed. Check log: $LOG_FILE"

            if [ "$SWITCHED" = "1" ]; then
              pm2 delete "${APP_NAME}-new" || true
              pm2 delete "$APP_NAME" || true
              if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                ln -sfn "$PREVIOUS_RELEASE" "$BASE_PATH/current"
                cd "$BASE_PATH/current"
                pm2 start npm --name "$APP_NAME" -- start -- -p "$PORT"
                pm2 save
                echo "Restored previous release: $PREVIOUS_RELEASE"
              fi
            fi

            exit "$status"
          }
          trap rollback ERR

          echo "Starting deployment at $TIMESTAMP"

          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_masdar_actions -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            git clone --branch "$BRANCH" --single-branch \
            git@github.com:masdar-alhayat/masdar-web.git "$RELEASE_DIR"

          cd "$RELEASE_DIR"
          DEPLOYED_COMMIT=$(git rev-parse --short HEAD)
          echo "Building commit $DEPLOYED_COMMIT from branch $BRANCH"
          printf '%s\n' "$DEPLOYED_COMMIT" > public/deployment-version.txt

          npm ci
          npm run build

          ln -sfn "$RELEASE_DIR" "$BASE_PATH/current"
          SWITCHED=1

          pm2 delete "${APP_NAME}-new" || true
          pm2 delete "$APP_NAME" || true
          cd "$BASE_PATH/current"
          pm2 start npm --name "$APP_NAME" -- start -- -p "$PORT"

          READY=0
          for attempt in $(seq 1 15); do
            HTML=$(curl -fsSL "http://127.0.0.1:$PORT/" || true)
            CSS_PATH=$(printf '%s' "$HTML" | grep -oE '/_next/static/[^" ]+\.css' | head -n 1 || true)
            SERVED_COMMIT=$(curl -fsSL "http://127.0.0.1:$PORT/deployment-version.txt" || true)

            if [ "$SERVED_COMMIT" = "$DEPLOYED_COMMIT" ] \
              && [ -n "$CSS_PATH" ] \
              && curl -fsSL "http://127.0.0.1:$PORT$CSS_PATH" > /dev/null \
              && curl -fsSL "http://127.0.0.1:$PORT/brand/masdar-logo.png" > /dev/null; then
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" != "1" ]; then
            echo "New release did not serve its CSS and public assets."
            pm2 logs "$APP_NAME" --lines 100 --nostream || true
            false
          fi

          pm2 save
          trap - ERR

          echo "Deployment successful: $DEPLOYED_COMMIT"

          cd "$BASE_PATH/releases"
          ls -dt */ | tail -n +4 | xargs -r rm -rf --
          REMOTE_SCRIPT
