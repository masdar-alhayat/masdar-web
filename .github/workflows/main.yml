name: Masdar Web Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: masdar-${{ github.event.inputs.environment }}-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Masdar Web
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Validate environment
      # =========================================================

      - name: Configure deployment
        id: config
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ github.event.inputs.environment }}"

          case "$ENVIRONMENT" in
            staging)
              echo "app_path=${{ secrets.VPS_BASE_PATH }}/staging" >> "$GITHUB_OUTPUT"
              echo "app_name=masdar-staging" >> "$GITHUB_OUTPUT"
              echo "port=3001" >> "$GITHUB_OUTPUT"
              echo "branch=staging" >> "$GITHUB_OUTPUT"
              ;;

            production)
              echo "app_path=${{ secrets.VPS_BASE_PATH }}/production" >> "$GITHUB_OUTPUT"
              echo "app_name=masdar-prod" >> "$GITHUB_OUTPUT"
              echo "port=3000" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Invalid environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          echo "Environment : $ENVIRONMENT"
          echo "App path    : configured"
          echo "App name    : $(grep '^app_name=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "Port        : $(grep '^port=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "Branch      : $(grep '^branch=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      # =========================================================
      # 2. Setup SSH
      # =========================================================

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # =========================================================
      # 3. Deploy
      # =========================================================

      - name: Deploy to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_BASE_PATH: ${{ secrets.VPS_BASE_PATH }}

          APP_PATH: ${{ steps.config.outputs.app_path }}
          APP_NAME: ${{ steps.config.outputs.app_name }}
          PORT: ${{ steps.config.outputs.port }}
          BRANCH: ${{ steps.config.outputs.branch }}

        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- \
            "$APP_PATH" \
            "$APP_NAME" \
            "$PORT" \
            "$BRANCH" \
            "$VPS_BASE_PATH" <<'REMOTE_SCRIPT'

          set -Eeuo pipefail

          APP_PATH="$1"
          APP_NAME="$2"
          PORT="$3"
          BRANCH="$4"
          VPS_BASE_PATH="$5"

          RELEASES_DIR="$APP_PATH/releases"
          LOG_DIR="$APP_PATH/logs"
          CURRENT_LINK="$APP_PATH/current"

          TIMESTAMP="$(date '+%Y-%m-%d_%H-%M-%S')"
          RELEASE_DIR="$RELEASES_DIR/$TIMESTAMP"
          LOG_FILE="$LOG_DIR/deploy_${TIMESTAMP}.log"

          PREVIOUS_RELEASE=""

          mkdir -p "$RELEASES_DIR"
          mkdir -p "$LOG_DIR"

          # -------------------------------------------------------
          # Logging
          # -------------------------------------------------------

          exec > >(tee -a "$LOG_FILE") 2>&1

          echo
          echo "======================================================"
          echo "MASDAR DEPLOYMENT"
          echo "======================================================"
          echo "Environment : $APP_NAME"
          echo "Branch      : $BRANCH"
          echo "Port        : $PORT"
          echo "Release     : $RELEASE_DIR"
          echo "Started     : $(date)"
          echo "======================================================"
          echo

          # -------------------------------------------------------
          # Error / rollback handler
          # -------------------------------------------------------

          rollback() {
            EXIT_CODE=$?

            echo
            echo "======================================================"
            echo "DEPLOYMENT FAILED"
            echo "======================================================"
            echo "Exit code: $EXIT_CODE"
            echo

            # -----------------------------------------------------
            # If current was changed, restore previous release
            # -----------------------------------------------------

            if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then

              echo "Rolling back to:"
              echo "$PREVIOUS_RELEASE"

              ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK"

              echo "Reloading PM2 application..."

              if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
                pm2 reload "$APP_NAME" --update-env || \
                  pm2 restart "$APP_NAME" --update-env || true
              else
                pm2 start "$VPS_BASE_PATH/ecosystem.config.js" \
                  --only "$APP_NAME" || true
              fi

              sleep 5

              if curl \
                --silent \
                --show-error \
                --fail \
                --max-time 10 \
                "http://127.0.0.1:${PORT}/" \
                >/dev/null 2>&1; then

                echo "Rollback health check: PASSED"

              else

                echo "Rollback health check: FAILED"
                echo "Manual investigation may be required."

              fi

            else

              echo "No previous release available for rollback."

            fi

            # -----------------------------------------------------
            # Remove failed release
            # -----------------------------------------------------

            if [ -d "$RELEASE_DIR" ]; then
              echo "Removing failed release..."
              rm -rf "$RELEASE_DIR"
            fi

            echo
            echo "Deployment failed."
            echo "Deployment log: $LOG_FILE"
            echo

            exit "$EXIT_CODE"
          }

          trap rollback ERR

          # -------------------------------------------------------
          # 1. Validate application directory
          # -------------------------------------------------------

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Application path does not exist:"
            echo "$APP_PATH"
            exit 1
          fi

          # -------------------------------------------------------
          # 2. Check required commands
          # -------------------------------------------------------

          command -v git >/dev/null 2>&1 || {
            echo "ERROR: git is not installed."
            exit 1
          }

          command -v node >/dev/null 2>&1 || {
            echo "ERROR: node is not installed."
            exit 1
          }

          command -v npm >/dev/null 2>&1 || {
            echo "ERROR: npm is not installed."
            exit 1
          }

          command -v pm2 >/dev/null 2>&1 || {
            echo "ERROR: PM2 is not installed."
            exit 1
          }

          command -v curl >/dev/null 2>&1 || {
            echo "ERROR: curl is not installed."
            exit 1
          }

          echo "Node: $(node -v)"
          echo "NPM : $(npm -v)"
          echo "PM2 : $(pm2 -v)"
          echo

          # -------------------------------------------------------
          # 3. Capture current release
          # -------------------------------------------------------

          if [ -L "$CURRENT_LINK" ]; then

            PREVIOUS_RELEASE="$(readlink -f "$CURRENT_LINK")"

            echo "Previous release:"
            echo "$PREVIOUS_RELEASE"

          elif [ -d "$CURRENT_LINK" ]; then

            echo "WARNING: current exists but is not a symlink."
            echo "Deployment aborted."

            exit 1

          else

            echo "No current release exists."
            echo "This appears to be the first deployment."

          fi

          # -------------------------------------------------------
          # 4. Create release directory
          # -------------------------------------------------------

          mkdir -p "$RELEASE_DIR"

          echo
          echo "Created release:"
          echo "$RELEASE_DIR"

          # -------------------------------------------------------
          # 5. Clone repository
          # -------------------------------------------------------

          echo
          echo "Cloning branch: $BRANCH"

          export GIT_SSH_COMMAND="ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes"

          git clone \
            --depth 1 \
            --branch "$BRANCH" \
            --single-branch \
            git@github.com:masdar-alhayat/masdar-web.git \
            "$RELEASE_DIR"

          cd "$RELEASE_DIR"

          # -------------------------------------------------------
          # 6. Capture deployed commit
          # -------------------------------------------------------

          DEPLOYED_COMMIT="$(git rev-parse HEAD)"

          echo
          echo "Deployed commit:"
          echo "$DEPLOYED_COMMIT"

          # -------------------------------------------------------
          # 7. Install dependencies
          # -------------------------------------------------------

          echo
          echo "Installing dependencies..."

          npm ci

          # -------------------------------------------------------
          # 8. Build application
          # -------------------------------------------------------

          echo
          echo "Building Next.js application..."

          npm run build

          echo
          echo "Build completed successfully."

          # -------------------------------------------------------
          # 9. Ensure ecosystem configuration exists
          # -------------------------------------------------------

          ECOSYSTEM_FILE="$VPS_BASE_PATH/ecosystem.config.js"

          if [ ! -f "$ECOSYSTEM_FILE" ]; then
            echo "ERROR: PM2 ecosystem file not found:"
            echo "$ECOSYSTEM_FILE"
            exit 1
          fi

          # -------------------------------------------------------
          # 10. Switch current symlink
          # -------------------------------------------------------

          echo
          echo "Switching current symlink..."

          ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

          echo "Current now points to:"
          readlink -f "$CURRENT_LINK"

          # -------------------------------------------------------
          # 11. Start / reload PM2 from ecosystem
          # -------------------------------------------------------

          echo
          echo "Starting/reloading PM2 application..."

          if pm2 describe "$APP_NAME" >/dev/null 2>&1; then

            echo "Existing PM2 process found."
            echo "Reloading: $APP_NAME"

            pm2 reload "$APP_NAME" --update-env

          else

            echo "PM2 process does not exist."
            echo "Starting from ecosystem configuration."

            pm2 start "$ECOSYSTEM_FILE" \
              --only "$APP_NAME" \
              --update-env

          fi

          # -------------------------------------------------------
          # 12. Save PM2 state
          # -------------------------------------------------------

          pm2 save

          # -------------------------------------------------------
          # 13. Application health check
          #
          # No /health endpoint is required.
          # We verify that the configured application port
          # accepts HTTP requests.
          # -------------------------------------------------------

          echo
          echo "Waiting for application..."

          HEALTHY=false

          for i in $(seq 1 30); do

            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 5 \
              "http://127.0.0.1:${PORT}/" \
              >/dev/null 2>&1; then

              HEALTHY=true
              echo "Application is responding."
              break

            fi

            echo "Health check attempt $i/30 failed. Waiting..."

            sleep 2

          done

          if [ "$HEALTHY" != "true" ]; then

            echo
            echo "ERROR: Application did not become healthy."

            echo
            echo "PM2 status:"
            pm2 status "$APP_NAME" || true

            echo
            echo "PM2 logs:"
            pm2 logs "$APP_NAME" \
              --lines 50 \
              --nostream || true

            exit 1

          fi

          # -------------------------------------------------------
          # 14. Verify current symlink
          # -------------------------------------------------------

          CURRENT_RELEASE="$(readlink -f "$CURRENT_LINK")"

          if [ "$CURRENT_RELEASE" != "$RELEASE_DIR" ]; then

            echo "ERROR: current symlink verification failed."
            echo "Expected: $RELEASE_DIR"
            echo "Actual  : $CURRENT_RELEASE"

            exit 1

          fi

          # -------------------------------------------------------
          # 15. Verify PM2 process
          # -------------------------------------------------------

          echo
          echo "Final PM2 status:"

          pm2 status "$APP_NAME"

          # -------------------------------------------------------
          # 16. Deployment success
          # -------------------------------------------------------

          echo
          echo "======================================================"
          echo "DEPLOYMENT SUCCESS"
          echo "======================================================"
          echo "Application : $APP_NAME"
          echo "Branch      : $BRANCH"
          echo "Commit      : $DEPLOYED_COMMIT"
          echo "Release     : $RELEASE_DIR"
          echo "Port        : $PORT"
          echo "Completed   : $(date)"
          echo "======================================================"
          echo

          # Disable rollback trap after successful deployment
          trap - ERR

          # -------------------------------------------------------
          # 17. Keep last 3 releases
          # -------------------------------------------------------

          echo "Cleaning old releases..."

          cd "$RELEASES_DIR"

          mapfile -t OLD_RELEASES < <(
            find . \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%T@ %p\n' |
            sort -nr |
            awk 'NR > 3 { print $2 }'
          )

          for RELEASE in "${OLD_RELEASES[@]}"; do
            echo "Removing old release: $RELEASE"
            rm -rf -- "$RELEASE"
          done

          echo
          echo "Release cleanup completed."

          REMOTE_SCRIPT

      # =========================================================
      # 4. Deployment complete
      # =========================================================

      - name: Deployment completed
        run: |
          echo "Masdar deployment completed successfully."
          echo "Environment: ${{ github.event.inputs.environment }}"