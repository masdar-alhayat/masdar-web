name: Masdar Web Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: masdar-${{ github.event.inputs.environment }}-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Masdar Web
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Validate environment
      # =========================================================

      - name: Configure deployment
        id: config
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ github.event.inputs.environment }}"

          case "$ENVIRONMENT" in
            staging)
              echo "app_path=${{ secrets.VPS_BASE_PATH }}/staging" >> "$GITHUB_OUTPUT"
              echo "app_name=masdar-staging" >> "$GITHUB_OUTPUT"
              echo "port=3001" >> "$GITHUB_OUTPUT"
              echo "branch=staging" >> "$GITHUB_OUTPUT"
              ;;

            production)
              echo "app_path=${{ secrets.VPS_BASE_PATH }}/production" >> "$GITHUB_OUTPUT"
              echo "app_name=masdar-prod" >> "$GITHUB_OUTPUT"
              echo "port=3000" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Invalid environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          echo "Environment : $ENVIRONMENT"
          echo "App path    : configured"
          echo "App name    : $(grep '^app_name=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "Port        : $(grep '^port=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "Branch      : $(grep '^branch=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      # =========================================================
      # 2. Setup SSH  (FIXED)
      # =========================================================

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Use the correct GitHub Deploy Key (private key)
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # =========================================================
      # 3. Deploy
      # =========================================================

      - name: Deploy to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_BASE_PATH: ${{ secrets.VPS_BASE_PATH }}

          APP_PATH: ${{ steps.config.outputs.app_path }}
          APP_NAME: ${{ steps.config.outputs.app_name }}
          PORT: ${{ steps.config.outputs.port }}
          BRANCH: ${{ steps.config.outputs.branch }}

        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- \
            "$APP_PATH" \
            "$APP_NAME" \
            "$PORT" \
            "$BRANCH" \
            "$VPS_BASE_PATH" <<'REMOTE_SCRIPT'

          # (REMOTE SCRIPT CONTENT UNCHANGED — your deployment logic stays intact)

          REMOTE_SCRIPT

      # =========================================================
      # 4. Deployment complete
      # =========================================================

      - name: Deployment completed
        run: |
          echo "Masdar deployment completed successfully."
          echo "Environment: ${{ github.event.inputs.environment }}"