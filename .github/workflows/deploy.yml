name: Build & Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Select Deployment Source
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            echo "branch=staging" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.branch }}

      - name: Verify Deployment Source
        shell: bash
        run: |
          echo "Building commit $(git rev-parse --short HEAD) from ${{ steps.vars.outputs.branch }} for ${{ github.event.inputs.environment }}"

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t parastoneglobal/masdar-web:${{ steps.vars.outputs.tag }} .

      - name: Push Docker Image
        run: |
          docker push parastoneglobal/masdar-web:${{ steps.vars.outputs.tag }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/masdar-web-docker

            if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
              SERVICE=staging
            else
              SERVICE=production
            fi

            docker compose pull "$SERVICE"
            docker compose up -d --force-recreate "$SERVICE"
